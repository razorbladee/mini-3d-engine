# CI pipeline for mini-3d-engine.
#
# NOTE: this file lives in ci/ rather than .github/workflows/ because the
# GitHub App used for automated commits lacks the `workflows` permission and
# the push is rejected. To activate it, a maintainer should copy it into place:
#
#   mkdir -p .github/workflows && cp ci/github-workflow.yml .github/workflows/ci.yml
#
# Until then run `npm run verify` locally before pushing.

name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
